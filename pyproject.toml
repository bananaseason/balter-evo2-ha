[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships its async ``hass`` fixture in the
# pytest-asyncio "auto" mode; strict mode (the default) does not recognise it and
# turns every async-fixture request into an error.
asyncio_mode = "auto"
# The transport tests drive the blocking TCP transport against a loopback
# FakeStation on 127.0.0.1. pytest-socket (bundled with phcc) otherwise blocks
# every socket; allow only loopback so no test can reach the real network.
addopts = "--allow-hosts=127.0.0.1,::1"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Pyflakes (unused imports/names, undefined refs), the pycodestyle logical/syntax
# checks, and import sorting. Deliberately not the full cosmetic set: the modules
# wrap to ~88 cols by hand and the tests use long descriptive lines on purpose.
select = ["E4", "E7", "E9", "F", "I"]
