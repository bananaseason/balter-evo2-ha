name: Bug report
description: Something does not work with your door station
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste passwords, access secrets or packet captures (.pcap) here.
  - type: input
    id: model
    attributes:
      label: Door station model and brand
      placeholder: Balter EVO 2 / Homaxi ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Enable debug logging for custom_components.balter_evo2 and paste the relevant lines. Remove secrets first.
      render: text
