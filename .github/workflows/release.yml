name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip integration
        run: |
          cd custom_components/balter_evo2
          zip -r ../../balter_evo2.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: balter_evo2.zip
          generate_release_notes: true
