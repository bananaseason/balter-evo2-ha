<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>balter-evo2-call-card demo</title>
<style>
  :root{--primary-background-color:#fafafa;--secondary-background-color:#e5e5e5;--card-background-color:#fff;
    --primary-text-color:#212121;--secondary-text-color:#727272;--primary-color:#03a9f4;--text-primary-color:#fff;
    --success-color:#4caf50;--error-color:#db4437;--warning-color:#ffa600;--divider-color:#e0e0e0;
    --ha-card-border-radius:12px;--ha-card-box-shadow:0 2px 6px rgba(0,0,0,.18);--ha-card-background:var(--card-background-color)}
  body.dark{--primary-background-color:#111;--secondary-background-color:#1c1c1c;--card-background-color:#1c1c1c;
    --primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:#333;--primary-color:#03a9f4}
  body{margin:0;background:var(--primary-background-color);color:var(--primary-text-color);font-family:Roboto,system-ui,sans-serif}
  main{max-width:460px;margin:0 auto;padding:16px}
  ha-card{display:block;background:var(--ha-card-background);border-radius:var(--ha-card-border-radius);box-shadow:var(--ha-card-box-shadow)}
  .tools{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
  .tools button,.tools select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--divider-color);background:var(--card-background-color);color:inherit}
  pre{font-size:12px;background:var(--secondary-background-color);padding:8px;border-radius:8px;white-space:pre-wrap;max-height:220px;overflow:auto}
  ha-icon{font-size:var(--mdc-icon-size,24px);line-height:1;align-items:center;justify-content:center}
</style>
</head>
<body>
<main>
  <h3>Balter EVO 2 call card (mock harness)</h3>
  <div id="slot"></div>
  <div class="tools">
    <button id="ring">Ring on/off</button>
    <button id="dark">Dark</button>
    <select id="scenario">
      <option value="normal">scenario: normal</option>
      <option value="busy">station busy (ws error)</option>
      <option value="busyev">station busy (ended event)</option>
      <option value="error">connect error</option>
      <option value="notfound">not_found</option>
      <option value="nomic">talk fails</option>
      <option value="slow">slow connect (4 s)</option>
      <option value="short">short call (35 s)</option>
    </select>
    <button id="lock">Lock unavailable on/off</button>
    <button id="lockfail">Door fails on/off</button>
  </div>
  <pre id="log"></pre>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
